<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3-phase PMA to bridge rectifier wiring">
  <defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#1f2937"/></marker></defs>
  <rect x="40" y="80" width="220" height="140" fill="#e6f2ff" stroke="#1f2937"/><text x="150" y="105" text-anchor="middle" font-size="14">PMA Stator</text>
  <circle cx="90" cy="145" r="6" fill="#000"/><circle cx="90" cy="170" r="6" fill="#000"/><circle cx="90" cy="195" r="6" fill="#000"/>
  <text x="105" y="149" font-size="12">Phase A (Black)</text><text x="105" y="174" font-size="12">Phase B (Brown)</text><text x="105" y="199" font-size="12">Phase C (Blue)</text>
  <rect x="470" y="70" width="250" height="160" fill="#fff4e6" stroke="#1f2937"/><text x="595" y="95" text-anchor="middle" font-size="14">3-Phase Bridge Rectifier</text>
  <circle cx="500" cy="130" r="6" fill="#000"/><circle cx="500" cy="160" r="6" fill="#000"/><circle cx="500" cy="190" r="6" fill="#000"/><text x="515" y="134" font-size="12">~</text><text x="515" y="164" font-size="12">~</text><text x="515" y="194" font-size="12">~</text>
  <circle cx="680" cy="130" r="6" fill="#000"/><circle cx="680" cy="190" r="6" fill="#000"/><text x="695" y="134" font-size="12">+</text><text x="695" y="194" font-size="12">−</text>
  <line x1="96" y1="145" x2="500" y2="130" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="96" y1="170" x2="500" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="96" y1="195" x2="500" y2="190" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="686" y1="130" x2="830" y2="130" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow2)"/><text x="760" y="120" text-anchor="middle" font-size="12">DC+ to breaker/controller (8 AWG Red)</text>
  <line x1="686" y1="190" x2="830" y2="190" stroke="#111827" stroke-width="3" marker-end="url(#arrow2)"/><text x="760" y="210" text-anchor="middle" font-size="12">DC− return (8 AWG Black)</text>
  <rect x="40" y="20" width="350" height="45" fill="#fff" stroke="#94a3b8"/><text x="55" y="47" font-size="12">Use strain relief, weatherproof enclosure, and heatsink per rectifier datasheet.</text>
  <rect x="540" y="240" width="320" height="45" fill="#fff" stroke="#94a3b8"/><text x="550" y="258" font-size="11">Legend: Black/Brown/Blue = 3-phase AC conductors</text><text x="550" y="274" font-size="11">Red = DC+, Black = DC−</text>
</svg>
