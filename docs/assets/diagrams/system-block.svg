<svg aria-labelledby="system-title system-title-desc" viewBox="0 0 980 360" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
  <title id="system-title">Overall VAWT electrical block diagram</title>
  <desc id="system-title-desc">Overall block diagram of turbine to battery and load wiring with grounding.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#1f2937"/></marker></defs>
  <rect x="20" y="120" width="140" height="70" fill="#e6f2ff" stroke="#1f2937"/><text x="90" y="150" text-anchor="middle" font-size="14">Turbine / PMA</text><text x="90" y="170" text-anchor="middle" font-size="12">3-phase AC</text>
  <rect x="220" y="120" width="140" height="70" fill="#e6f2ff" stroke="#1f2937"/><text x="290" y="150" text-anchor="middle" font-size="14">Rectifier</text><text x="290" y="170" text-anchor="middle" font-size="12">AC → DC</text>
  <rect x="420" y="120" width="160" height="70" fill="#e6f2ff" stroke="#1f2937"/><text x="500" y="150" text-anchor="middle" font-size="14">Disconnect / Breaker</text><text x="500" y="170" text-anchor="middle" font-size="12">DC rated</text>
  <rect x="640" y="120" width="160" height="70" fill="#e6f2ff" stroke="#1f2937"/><text x="720" y="150" text-anchor="middle" font-size="14">Wind Charge Controller</text><text x="720" y="170" text-anchor="middle" font-size="12">Diversion capable</text>
  <rect x="840" y="40" width="130" height="70" fill="#fff4e6" stroke="#1f2937"/><text x="905" y="70" text-anchor="middle" font-size="14">Dump Load</text><text x="905" y="90" text-anchor="middle" font-size="12">12-10 AWG</text>
  <rect x="840" y="150" width="130" height="70" fill="#e8ffe8" stroke="#1f2937"/><text x="905" y="180" text-anchor="middle" font-size="14">Battery Bank</text><text x="905" y="200" text-anchor="middle" font-size="12">24V DC</text>
  <rect x="840" y="260" width="130" height="70" fill="#f3f0ff" stroke="#1f2937"/><text x="905" y="290" text-anchor="middle" font-size="14">Inverter / DC Loads</text><text x="905" y="310" text-anchor="middle" font-size="12">Load side</text>
  <line x1="160" y1="155" x2="220" y2="155" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><text x="190" y="145" text-anchor="middle" font-size="11" fill="#0b6dbb">3× AC, 10 AWG (Black/Brown/Blue)</text>
  <line x1="360" y1="155" x2="420" y2="155" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="145" text-anchor="middle" font-size="11" fill="#b91c1c">DC +/−, 8 AWG (Red/Black)</text>
  <line x1="580" y1="155" x2="640" y2="155" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="145" x2="840" y2="90" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="165" x2="840" y2="185" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="905" y1="220" x2="905" y2="260" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="190" x2="90" y2="340" stroke="#065f46" stroke-width="2"/><line x1="290" y1="190" x2="290" y2="340" stroke="#065f46" stroke-width="2"/><line x1="500" y1="190" x2="500" y2="340" stroke="#065f46" stroke-width="2"/><line x1="720" y1="190" x2="720" y2="340" stroke="#065f46" stroke-width="2"/><line x1="905" y1="220" x2="905" y2="340" stroke="#065f46" stroke-width="2"/>
  <line x1="60" y1="340" x2="935" y2="340" stroke="#065f46" stroke-width="3"/><text x="500" y="356" text-anchor="middle" font-size="12">Ground bond (Green/Yellow, per local code)</text>
  <rect x="20" y="20" width="300" height="85" fill="#ffffff" stroke="#94a3b8"/><text x="30" y="42" font-size="12">Legend:</text><text x="30" y="60" font-size="12">Blue note = AC side wires</text><text x="30" y="76" font-size="12">Red note = DC power wires</text><text x="30" y="92" font-size="12">Green lines = grounding conductor</text>
</svg>
